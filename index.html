<h1>clip-uploader</h1>
<p>clip-uploader は、運営者が管理する自分のYouTubeチャンネルへ、制作済みのショート動画をアップロードし、そのチャンネルの再生成績を確認するための個人用ツールです。</p>
<p>運営者本人のチャンネルだけで使い、一般の利用者には提供していません。</p>
<ul>
<li>YouTube Data API：自分のチャンネルの確認と、動画のアップロード</li>
<li>YouTube Analytics API：自分のチャンネルの再生数・視聴時間などの確認</li>
</ul>
